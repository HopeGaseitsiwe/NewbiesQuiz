<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — NewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="./style.css"/>
  <script>
/* ── DB ── */
var DB={get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};
/* ── hashPw ── */
function hashPw(pw){var key='sq_key_2025',out='';for(var i=0;i<pw.length;i++){out+=('0'+(pw.charCodeAt(i)^key.charCodeAt(i%key.length)).toString(16)).slice(-2);}return out;}
/* ── Users ── */
var Users={all:function(){return DB.get('sq_users')||{};},get:function(u){if(!u)return null;return this.all()[String(u).toLowerCase()]||null;},login:function(username,password){try{var u=this.get(username);if(!u)return{ok:false,msg:'Username not found 🙁'};if(u.password!==hashPw(password))return{ok:false,msg:'Wrong password 🔐'};DB.set('sq_session',u.username);return{ok:true,user:u};}catch(e){return{ok:false,msg:'Error: '+e.message};}},current:function(){try{var k=DB.get('sq_session');return k?this.get(k):null;}catch(e){return null;}},update:function(username,data){try{var users=this.all(),k=String(username).toLowerCase();if(!users[k])return;Object.keys(data).forEach(function(p){users[k][p]=data[p];});DB.set('sq_users',users);}catch(e){}}};
/* ── Pairs ── */
var Pairs={all:function(){return DB.get('sq_pairs')||[];},add:function(a,b){try{var pairs=this.all(),a2=String(a).toLowerCase(),b2=String(b).toLowerCase();if(!pairs.some(function(p){return(p.a===a2&&p.b===b2)||(p.a===b2&&p.b===a2);})){pairs.push({a:a2,b:b2,at:Date.now()});DB.set('sq_pairs',pairs);}}catch(e){}},partner:function(u){try{var k=String(u).toLowerCase(),pair=this.all().find(function(p){return p.a===k||p.b===k;});return pair?(pair.a===k?pair.b:pair.a):null;}catch(e){return null;}}};
/* ── Toast ── */
function showToast(msg){try{var t=document.createElement('div');t.className='toast-sq';t.innerHTML=msg;document.body.appendChild(t);setTimeout(function(){try{document.body.removeChild(t);}catch(e){}},5000);}catch(e){}}
  </script>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="./index.html">&#128151; <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
        <li class="nav-item"><a class="nav-link" href="./login.html">Login</a></li>
        <li class="nav-item ms-2"><a class="btn-nav-cta btn" href="./register.html">Sign Up</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7 col-xl-5">

        <div class="text-center mb-4 fade-in">
          <div style="font-size:3rem;margin-bottom:0.5rem;">&#128274;</div>
          <h1 style="font-size:1.8rem;color:var(--sq-dark);">Welcome Back</h1>
          <p style="color:var(--sq-muted);">Sign in to continue your journey</p>
        </div>

        <div id="invite-banner" style="display:none;background:var(--sq-baby);border:1.5px solid var(--sq-baby2);color:var(--sq-dark);border-radius:12px;padding:0.8rem 1rem;margin-bottom:1rem;font-size:0.9rem;"></div>

        <div class="auth-card fade-in">

          <div id="error-box" style="display:none;background:#fff0f3;border:1.5px solid #ffb3c9;color:#a8004a;border-radius:10px;padding:0.8rem 1rem;margin-bottom:1.2rem;font-size:0.92rem;"></div>

          <div class="mb-3">
            <label class="form-label fw-semibold" style="color:var(--sq-muted);">Username</label>
            <div class="input-group">
              <span class="input-group-text" style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-right:none;border-radius:10px 0 0 10px;font-weight:700;color:var(--sq-dark);">@</span>
              <input type="text" class="form-control" id="inp-username"
                     placeholder="Your username"
                     style="border-left:none;border-radius:0 10px 10px 0;"
                     autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"/>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" style="color:var(--sq-muted);">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="inp-password"
                     placeholder="Your password"
                     style="border-radius:10px 0 0 10px;" autocomplete="current-password"/>
              <button type="button" id="toggle-pw"
                      style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-left:none;border-radius:0 10px 10px 0;padding:0 0.75rem;cursor:pointer;">
                <i class="bi bi-eye" style="color:var(--sq-dark);"></i>
              </button>
            </div>
          </div>

          <div class="d-grid">
            <button type="button" id="login-btn" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </div>

          <div class="auth-switch mt-3">
            New here? <a href="./register.html">Create an account</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">&#128151; NewbiesQuiz</div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">&copy; 2026 NewbiesQuiz</div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Redirect if already signed in
  (function() {
    try { if (Users.current()) { window.location.href = './dashboard.html'; } } catch(e) {}
  })();

  // Invite banner
  (function() {
    try {
      var p = new URLSearchParams(window.location.search);
      var by = p.get('invited_by');
      if (by) {
        var el = document.getElementById('invite-banner');
        el.innerHTML = '&#128140; <strong>' + decodeURIComponent(by) + '</strong> invited you to take NewbiesQuiz!';
        el.style.display = 'block';
      }
    } catch(e) {}
  })();

  // Show/hide error
  function showErr(msg) {
    var el = document.getElementById('error-box');
    el.innerHTML = '&#9888;&nbsp;' + msg;
    el.style.display = 'block';
  }

  // Password toggle
  document.getElementById('toggle-pw').onclick = function() {
    var pw = document.getElementById('inp-password');
    var ic = this.querySelector('i');
    if (pw.type === 'password') { pw.type = 'text';     ic.className = 'bi bi-eye-slash'; }
    else                        { pw.type = 'password'; ic.className = 'bi bi-eye'; }
  };

  // Sign in
  function doLogin() {
    document.getElementById('error-box').style.display = 'none';
    var username = (document.getElementById('inp-username').value || '').trim();
    var password = document.getElementById('inp-password').value || '';
    if (!username) return showErr('Please enter your username.');
    if (!password) return showErr('Please enter your password.');
    var result = Users.login(username, password);
    if (!result.ok) return showErr(result.msg);
    // invite linking
    try {
      var p2 = new URLSearchParams(window.location.search);
      var by2 = p2.get('invited_by');
      if (by2) {
        var inv = decodeURIComponent(by2).toLowerCase();
        Pairs.add(inv, result.user.username);
        Users.update(result.user.username, { invitedBy: inv });
      }
    } catch(e) {}
    showToast('Welcome back, ' + result.user.displayName + '! &#128151;');
    var fresh = Users.get(result.user.username);
    window.location.href = (fresh && fresh.answeredQuiz) ? './dashboard.html' : './quiz.html';
  }

  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('inp-username').onkeydown = function(e) { if (e.key==='Enter') doLogin(); };
  document.getElementById('inp-password').onkeydown = function(e) { if (e.key==='Enter') doLogin(); };
</script>
</body>
</html>
