<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — NewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="./style.css"/>
  <script>
var DB={get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};
function hashPw(pw){var key='sq_key_2025',out='';for(var i=0;i<pw.length;i++){out+=('0'+(pw.charCodeAt(i)^key.charCodeAt(i%key.length)).toString(16)).slice(-2);}return out;}
var Users={all:function(){return DB.get('sq_users')||{};},get:function(u){if(!u)return null;return this.all()[String(u).toLowerCase()]||null;},add:function(username,password,displayName){try{var users=this.all(),key=String(username).toLowerCase().trim();if(users[key])return{ok:false,msg:'Username already taken 💔'};users[key]={username:key,displayName:String(displayName||username).trim(),password:hashPw(password),createdAt:Date.now(),notifications:[],answeredQuiz:false};DB.set('sq_users',users);return{ok:true};}catch(e){return{ok:false,msg:'Save error: '+e.message};}},login:function(username,password){try{var u=this.get(username);if(!u)return{ok:false,msg:'Username not found'};if(u.password!==hashPw(password))return{ok:false,msg:'Wrong password'};DB.set('sq_session',u.username);return{ok:true,user:u};}catch(e){return{ok:false,msg:'Error: '+e.message};}},current:function(){try{var k=DB.get('sq_session');return k?this.get(k):null;}catch(e){return null;}}};
function showToast(msg){try{var t=document.createElement('div');t.className='toast-sq';t.innerHTML=msg;document.body.appendChild(t);setTimeout(function(){try{document.body.removeChild(t);}catch(e){}},5000);}catch(e){}}
  </script>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="./index.html">&#128151; <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
        <li class="nav-item"><a class="nav-link" href="./login.html">Login</a></li>
        <li class="nav-item ms-2"><a class="btn-nav-cta btn" href="./register.html">Sign Up</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7 col-xl-6">

        <div class="text-center mb-4 fade-in">
          <div style="font-size:3rem;margin-bottom:0.5rem;">&#128151;</div>
          <h1 style="font-size:1.8rem;color:var(--sq-dark);">Create Your Account</h1>
          <p style="color:var(--sq-muted);">Start your compatibility journey &mdash; it&rsquo;s completely free.</p>
        </div>

        <div class="auth-card fade-in">

          <div id="error-box" style="display:none;background:#fff0f3;border:1.5px solid #ffb3c9;color:#a8004a;border-radius:10px;padding:0.8rem 1rem;margin-bottom:1.2rem;font-size:0.92rem;"></div>
          <div id="ok-box" style="display:none;background:#e8f9f0;border:1.5px solid #b3e8cc;color:#1a7a4a;border-radius:10px;padding:0.8rem 1rem;margin-bottom:1.2rem;font-size:0.92rem;"></div>

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Display Name</label>
              <input type="text" class="form-control" id="inp-name"
                     placeholder="e.g. Lebo, Sipho, Thandeka"
                     autocomplete="off" autocorrect="off" spellcheck="false"/>
              <div class="form-text" style="color:var(--sq-muted);">The name others will see</div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Username</label>
              <div class="input-group">
                <span class="input-group-text" style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-right:none;border-radius:10px 0 0 10px;font-weight:700;color:var(--sq-dark);">@</span>
                <input type="text" class="form-control" id="inp-username"
                       placeholder="e.g. lebo_sunshine (no spaces)"
                       style="border-left:none;border-radius:0 10px 10px 0;"
                       autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none"/>
              </div>
              <div class="form-text" style="color:var(--sq-muted);">How others find and invite you</div>
            </div>

            <div class="col-sm-6">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="inp-pw"
                       placeholder="At least 6 characters"
                       style="border-radius:10px 0 0 10px;" autocomplete="new-password"/>
                <button type="button" id="toggle-pw"
                        style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-left:none;border-radius:0 10px 10px 0;padding:0 0.75rem;cursor:pointer;">
                  <i class="bi bi-eye" style="color:var(--sq-dark);"></i>
                </button>
              </div>
            </div>

            <div class="col-sm-6">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Confirm Password</label>
              <input type="password" class="form-control" id="inp-pw2"
                     placeholder="Repeat password" autocomplete="new-password"/>
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="button" id="reg-btn" class="btn btn-primary btn-lg">
              <i class="bi bi-heart-fill me-2"></i>Create Account &amp; Start Quiz
            </button>
          </div>

          <div class="auth-switch mt-3">
            Already have an account? <a href="./login.html">Sign in here</a>
          </div>
        </div>

        <div class="row g-2 mt-3 text-center">
          <div class="col-4"><div style="font-size:1.4rem;">&#128274;</div><div style="font-size:0.75rem;color:var(--sq-muted);">Private</div></div>
          <div class="col-4"><div style="font-size:1.4rem;">&#9889;</div><div style="font-size:0.75rem;color:var(--sq-muted);">5 minutes</div></div>
          <div class="col-4"><div style="font-size:1.4rem;">&#128175;</div><div style="font-size:0.75rem;color:var(--sq-muted);">Free</div></div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">&#128151; NewbiesQuiz</div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">&copy; 2026 NewbiesQuiz</div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function(){ try{ if(Users.current()) window.location.href='./dashboard.html'; }catch(e){} })();

  function showErr(msg){ var el=document.getElementById('error-box'); el.innerHTML='&#9888;&nbsp;'+msg; el.style.display='block'; document.getElementById('ok-box').style.display='none'; }
  function showOk(msg){ var el=document.getElementById('ok-box'); el.innerHTML=msg; el.style.display='block'; document.getElementById('error-box').style.display='none'; }

  document.getElementById('toggle-pw').onclick = function(){
    var pw=document.getElementById('inp-pw'), ic=this.querySelector('i');
    if(pw.type==='password'){pw.type='text'; ic.className='bi bi-eye-slash';}
    else{pw.type='password'; ic.className='bi bi-eye';}
  };

  function doRegister(){
    document.getElementById('error-box').style.display='none';
    document.getElementById('ok-box').style.display='none';
    var name = (document.getElementById('inp-name').value||'').trim();
    var user = (document.getElementById('inp-username').value||'').trim();
    var pw   = document.getElementById('inp-pw').value||'';
    var pw2  = document.getElementById('inp-pw2').value||'';
    if(!name)              return showErr('Please enter your display name.');
    if(!user)              return showErr('Please choose a username.');
    if(/\s/.test(user))    return showErr('Username cannot have spaces — use underscores e.g. lebo_sunshine');
    if(user.length < 3)    return showErr('Username must be at least 3 characters.');
    if(pw.length < 6)      return showErr('Password must be at least 6 characters.');
    if(pw !== pw2)         return showErr('Passwords do not match.');
    var r = Users.add(user, pw, name);
    if(!r.ok) return showErr(r.msg);
    var lr = Users.login(user, pw);
    if(!lr.ok) return showErr('Account saved! Please <a href="./login.html">sign in here</a>.');
    showOk('&#10003; Account created! Redirecting you to the quiz…');
    setTimeout(function(){ window.location.href='./quiz.html'; }, 1000);
  }

  document.getElementById('reg-btn').onclick = doRegister;
  ['inp-name','inp-username','inp-pw','inp-pw2'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.onkeydown=function(e){ if(e.key==='Enter') doRegister(); };
  });
</script>
</body>
</html>
