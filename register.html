<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — NewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">&#128151; <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1" id="main-nav"></ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7 col-xl-6">

        <div class="text-center mb-4 fade-in">
          <span class="auth-icon">&#128151;</span>
          <h1 style="font-size:1.8rem;color:var(--sq-dark);">Create Your Account</h1>
          <p style="color:var(--sq-muted);">Start your compatibility journey today &mdash; it&rsquo;s completely free.</p>
        </div>

        <div class="auth-card fade-in">

          <div id="error-alert" class="alert d-none mb-3" role="alert"
               style="background:#fff0f3;border:1.5px solid #ffb3c9;color:var(--sq-dark);border-radius:10px;"></div>

          <div id="success-alert" class="alert d-none mb-3" role="alert"
               style="background:#e8f9f0;border:1.5px solid #b3e8cc;color:#1a5c35;border-radius:10px;"></div>

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Display Name</label>
              <div class="input-group">
                <span class="input-group-text"
                  style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-right:none;border-radius:10px 0 0 10px;">
                  <i class="bi bi-person-heart" style="color:var(--sq-dark);"></i>
                </span>
                <input type="text" class="form-control" id="display-name"
                  placeholder="e.g. Lebo, Sipho, Thandeka"
                  style="border-left:none;border-radius:0 10px 10px 0;"
                  autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"/>
              </div>
              <div class="form-text" style="color:var(--sq-muted);">Your friendly name shown to others</div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Username</label>
              <div class="input-group">
                <span class="input-group-text"
                  style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-right:none;border-radius:10px 0 0 10px;font-weight:700;color:var(--sq-dark);">@</span>
                <input type="text" class="form-control" id="username"
                  placeholder="e.g. lebo_sunshine"
                  style="border-left:none;border-radius:0 10px 10px 0;"
                  autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>
              </div>
              <div class="form-text" style="color:var(--sq-muted);">No spaces — use underscores. How others find you.</div>
            </div>

            <div class="col-sm-6">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password"
                  placeholder="At least 6 characters"
                  style="border-radius:10px 0 0 10px;" autocomplete="new-password"/>
                <button class="btn" type="button" id="toggle-pw"
                  style="background:var(--sq-baby);border:2px solid var(--sq-baby2);border-left:none;border-radius:0 10px 10px 0;">
                  <i class="bi bi-eye" id="eye-icon" style="color:var(--sq-dark);"></i>
                </button>
              </div>
            </div>

            <div class="col-sm-6">
              <label class="form-label fw-semibold" style="color:var(--sq-muted);">Confirm Password</label>
              <input type="password" class="form-control" id="confirm-password"
                placeholder="Repeat password" autocomplete="new-password"/>
            </div>
          </div>

          <div class="d-grid mt-4">
            <button class="btn btn-primary btn-lg" id="register-btn" type="button">
              <i class="bi bi-heart-fill me-2"></i>Create Account &amp; Start Quiz
            </button>
          </div>

          <div class="auth-switch">
            Already have an account? <a href="login.html">Sign in here</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">&#128151; Quiz</div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">&copy; 2026 NewbiesQuiz</div>
    </div>
  </div>
</footer>

<!-- Bootstrap JS first, then data.js, then page script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script>
(function() {
  // Run immediately once DOM is ready
  function init() {

    // Safety check — if data.js failed to load, show a clear message
    if (typeof Users === 'undefined' || typeof DB === 'undefined') {
      document.getElementById('error-alert').innerHTML =
        'App failed to load. Please hard-refresh the page (Ctrl+Shift+R or Cmd+Shift+R).';
      document.getElementById('error-alert').classList.remove('d-none');
      document.getElementById('register-btn').disabled = true;
      return;
    }

    // If already logged in, go to dashboard
    if (Users.current()) {
      window.location.replace('dashboard.html');
      return;
    }

    function showError(msg) {
      var el = document.getElementById('error-alert');
      el.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>' + msg;
      el.classList.remove('d-none');
      document.getElementById('success-alert').classList.add('d-none');
    }

    function showSuccess(msg) {
      var el = document.getElementById('success-alert');
      el.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>' + msg;
      el.classList.remove('d-none');
      document.getElementById('error-alert').classList.add('d-none');
    }

    // Password visibility toggle
    document.getElementById('toggle-pw').onclick = function() {
      var pw = document.getElementById('password');
      var icon = document.getElementById('eye-icon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'bi bi-eye';
      }
    };

    // Register
    document.getElementById('register-btn').onclick = function() {
      document.getElementById('error-alert').classList.add('d-none');

      var displayName = document.getElementById('display-name').value.trim();
      var username    = document.getElementById('username').value.trim();
      var password    = document.getElementById('password').value;
      var confirm     = document.getElementById('confirm-password').value;

      if (!displayName)         return showError('Please enter your display name.');
      if (!username)            return showError('Please choose a username.');
      if (/\s/.test(username))  return showError('Username cannot contain spaces. Use underscores instead.');
      if (username.length < 3)  return showError('Username must be at least 3 characters.');
      if (password.length < 6)  return showError('Password must be at least 6 characters.');
      if (password !== confirm)  return showError('Passwords do not match.');

      var result = Users.addUser(username, password, displayName);
      if (!result.ok) return showError(result.msg);

      var loginResult = Users.login(username, password);
      if (!loginResult.ok) return showError('Account created but could not log in: ' + loginResult.msg);

      showSuccess('Account created! Redirecting you to the quiz...');
      document.getElementById('register-btn').disabled = true;

      setTimeout(function() {
        window.location.href = 'quiz.html';
      }, 1000);
    };

    // Enter key support
    var fields = ['display-name', 'username', 'password', 'confirm-password'];
    for (var i = 0; i < fields.length; i++) {
      (function(id) {
        var el = document.getElementById(id);
        if (el) {
          el.onkeydown = function(e) {
            if (e.key === 'Enter') document.getElementById('register-btn').onclick();
          };
        }
      })(fields[i]);
    }
  }

  // Wait for DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
