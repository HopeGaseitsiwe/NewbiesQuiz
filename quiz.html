<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Quiz — NewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">💗 <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1" id="main-nav"></ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">

        <!-- Topic progress chips -->
        <div class="d-flex flex-wrap gap-2 mb-3" id="topic-chips"></div>

        <!-- Progress bar -->
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="progress flex-grow-1">
            <div class="progress-bar" id="progress-fill" style="width:0%" role="progressbar"></div>
          </div>
          <span id="progress-label" style="font-size:0.82rem;color:var(--sq-muted);white-space:nowrap;font-weight:600;">
            1 / 15
          </span>
        </div>

        <!-- Quiz card -->
        <div id="quiz-area"></div>

      </div>
    </div>
  </div>
</main>

<!-- Invite Modal -->
<div class="modal fade" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="border-bottom:1px solid var(--sq-baby2);">
        <div>
          <div style="font-size:1.8rem;line-height:1;">💌</div>
          <h5 class="modal-title mt-1" id="inviteModalLabel" style="font-family:'Playfair Display',serif;color:var(--sq-dark);">Invite Your Person</h5>
          <p class="text-muted mb-0" style="font-size:0.85rem;">Select someone — they'll get notified when they log in.</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
          <span class="input-group-text" style="background:var(--sq-baby);border:2px solid var(--sq-baby2);">
            <i class="bi bi-search" style="color:var(--sq-dark);"></i>
          </span>
          <input type="text" class="form-control" id="user-search" placeholder="Search by username or name…"
                 style="border-left:none;"/>
        </div>
        <div id="user-list" style="max-height:280px;overflow-y:auto;"></div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--sq-baby2);">
        <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="send-invite-btn" disabled>
          <i class="bi bi-send me-2"></i>Send Invite
        </button>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">💗 NewbiesQuiz</div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">© 2026 Quiz · Made with 💕</div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const session = Users.current();
    if (!session) { window.location.href = 'login.html'; return; }

    const user = Users.getUser(session.username);
    if (user.answeredQuiz) { renderComplete(true); return; }

    let currentIdx = 0;
    let answers = Answers.get(user.username) || {};
    const TOTAL = QUESTIONS.length; // 15
    const TOPICS_ORDER = [...new Set(QUESTIONS.map(q => q.topic))];

    /* ── Topic chips ── */
    function renderChips() {
      document.getElementById('topic-chips').innerHTML = TOPICS_ORDER.map(t => {
        const qs = QUESTIONS.filter(q => q.topic === t);
        const done = qs.every(q => answers[q.id]);
        return `<span class="topic-chip ${done ? 'done' : ''}">
          ${TOPIC_META[t].icon} ${TOPIC_META[t].label}
          ${done ? '<i class="bi bi-check-circle-fill ms-1" style="font-size:0.7rem;"></i>' : ''}
        </span>`;
      }).join('');
    }

    /* ── Progress ── */
    function updateProgress() {
      const answered = Object.keys(answers).length;
      const pct = Math.round((answered / TOTAL) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-label').textContent = `${currentIdx + 1} / ${TOTAL}`;
    }

    /* ── Render question ── */
    function renderQuestion(idx) {
      const q = QUESTIONS[idx];
      const saved = answers[q.id] || null;
      const area = document.getElementById('quiz-area');

      let answerHTML = '';
      if (q.type === 'options') {
        const letters = ['A','B','C','D','E'];
        answerHTML = q.options.map((opt, i) => `
          <button class="option-btn ${saved === opt ? 'selected' : ''}" data-opt="${opt}">
            <span class="option-letter">${letters[i]}</span>
            <span>${opt}</span>
          </button>`).join('');
      } else {
        answerHTML = `
          <textarea class="form-control open-textarea" id="open-ans" rows="4"
            placeholder="Be honest — there are no wrong answers here 💕"
            style="min-height:120px;resize:vertical;">${saved || ''}</textarea>`;
      }

      area.innerHTML = `
        <div class="flash-card fade-in">
          <div class="d-flex align-items-start justify-content-between mb-2 flex-wrap gap-2">
            <span class="topic-badge">${q.icon} ${TOPIC_META[q.topic].label}</span>
            <span style="font-size:0.8rem;color:var(--sq-muted);font-weight:600;">Question ${idx+1} of ${TOTAL}</span>
          </div>

          <p class="q-text">${q.text}</p>

          <div id="answer-area">${answerHTML}</div>

          <div class="d-flex align-items-center justify-content-between mt-4 gap-2 flex-wrap">
            <button class="btn btn-soft" id="prev-btn" ${idx === 0 ? 'disabled' : ''}>
              <i class="bi bi-arrow-left me-1"></i> Previous
            </button>
            <div class="d-flex gap-1">
              ${QUESTIONS.map((_,i) => `
                <span style="width:8px;height:8px;border-radius:50%;background:${answers[QUESTIONS[i].id]?'var(--sq-dark)':'var(--sq-baby2)'};display:inline-block;transition:background 0.3s;"></span>
              `).join('')}
            </div>
            <button class="btn btn-primary" id="next-btn">
              ${idx === TOTAL - 1 ? '<i class="bi bi-check-circle me-1"></i>Finish Quiz' : 'Next <i class="bi bi-arrow-right ms-1"></i>'}
            </button>
          </div>
        </div>
      `;

      // Option click handlers
      area.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          area.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          answers[q.id] = btn.dataset.opt;
          Answers.save(user.username, answers);
          renderChips();
          updateProgress();
        });
      });

      // Open text auto-save
      const ta = area.querySelector('#open-ans');
      if (ta) {
        ta.addEventListener('input', () => {
          answers[q.id] = ta.value.trim();
          Answers.save(user.username, answers);
          renderChips();
          updateProgress();
        });
      }

      // Navigation
      document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentIdx > 0) { currentIdx--; renderQuestion(currentIdx); updateProgress(); }
      });
      document.getElementById('next-btn').addEventListener('click', () => {
        if (q.type === 'open' && ta) { answers[q.id] = ta.value.trim(); Answers.save(user.username, answers); }
        if (!answers[q.id]) {
          showToast('⚠️ Please answer this question before moving on!', 2500);
          return;
        }
        if (currentIdx < TOTAL - 1) { currentIdx++; renderQuestion(currentIdx); updateProgress(); }
        else finishQuiz();
      });
    }

    function finishQuiz() {
      Users.update(user.username, { answeredQuiz: true });
      renderComplete(false);
    }

    /* ── Complete screen ── */
    function renderComplete(alreadyDone) {
      document.getElementById('topic-chips').innerHTML = '';
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('progress-label').textContent = '✅ Done!';

      const partner = Pairs.getPartner(user.username);
      const partnerUser = partner ? Users.getUser(partner) : null;
      const partnerDone = partnerUser?.answeredQuiz;

      document.getElementById('quiz-area').innerHTML = `
        <div class="flash-card text-center fade-in py-4">
          <div style="font-size:3.5rem;margin-bottom:1rem;">${alreadyDone ? '✅' : '🎉'}</div>
          <h2 style="color:var(--sq-dark);font-size:1.7rem;">${alreadyDone ? 'Quiz Already Completed!' : 'You\'re Done! Amazing 💗'}</h2>
          <p style="color:var(--sq-muted);max-width:420px;margin:0.8rem auto 2rem;line-height:1.7;">
            ${alreadyDone
              ? 'Your answers are saved. Invite your person or check your results below.'
              : 'Your answers are saved. Now invite someone to take the quiz and compare answers with you!'}
          </p>
          <div class="d-flex gap-3 justify-content-center flex-wrap">
            ${partnerDone
              ? `<a href="results.html" class="btn btn-primary btn-lg"><i class="bi bi-fire me-2"></i>See Your Compatibility</a>`
              : `<button class="btn btn-primary btn-lg" id="open-invite-btn"><i class="bi bi-send me-2"></i>Invite Your Person</button>`}
            <a href="dashboard.html" class="btn btn-soft btn-lg">Go to Dashboard</a>
          </div>
          ${partnerUser && !partnerDone ? `
            <div class="mt-4 p-3 rounded-3" style="background:var(--sq-baby);border:1.5px solid var(--sq-baby2);">
              <i class="bi bi-hourglass-split text-warning me-2"></i>
              Waiting for <strong>${partnerUser.displayName}</strong> to complete their quiz…
            </div>` : ''}
        </div>
      `;

      const openBtn = document.getElementById('open-invite-btn');
      if (openBtn) {
        openBtn.addEventListener('click', () => {
          renderUserList('');
          inviteModal.show();
        });
      }
    }

    // Initial render
    renderQuestion(currentIdx);
    updateProgress();
    renderChips();

    /* ── Invite Modal ── */
    const inviteModal = new bootstrap.Modal(document.getElementById('inviteModal'));
    let selectedUserKey = null;

    function renderUserList(filter) {
      const list = document.getElementById('user-list');
      const allUsers = Users.getAll();
      const keys = Object.keys(allUsers).filter(k => {
        if (k === user.username) return false;
        if (!filter) return true;
        const f = filter.toLowerCase();
        return k.includes(f) || allUsers[k].displayName.toLowerCase().includes(f);
      });

      if (!keys.length) {
        list.innerHTML = `<div class="text-center py-4" style="color:var(--sq-muted);">
          <i class="bi bi-people fs-2 d-block mb-2"></i>No other users found yet 🕊️<br>
          <small>Share the app link so your person can create an account!</small>
        </div>`;
        return;
      }

      list.innerHTML = keys.map(k => {
        const u = allUsers[k];
        return `
          <div class="user-item ${selectedUserKey === k ? 'selected' : ''}" data-key="${k}">
            <div class="user-avatar-sm">${u.displayName.charAt(0).toUpperCase()}</div>
            <div class="flex-grow-1">
              <div style="font-weight:600;font-size:0.95rem;">${u.displayName}</div>
              <div style="font-size:0.78rem;color:var(--sq-muted);">@${k}</div>
            </div>
            ${u.answeredQuiz
              ? `<span class="badge" style="background:var(--sq-baby);color:var(--sq-dark);border:1px solid var(--sq-baby2);font-size:0.72rem;">✅ Quiz done</span>`
              : `<span class="badge" style="background:#f5f5f5;color:#888;font-size:0.72rem;">Quiz pending</span>`}
          </div>`;
      }).join('');

      list.querySelectorAll('.user-item').forEach(item => {
        item.addEventListener('click', () => {
          list.querySelectorAll('.user-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          selectedUserKey = item.dataset.key;
          document.getElementById('send-invite-btn').disabled = false;
        });
      });
    }

    document.getElementById('user-search').addEventListener('input', e => renderUserList(e.target.value));

    document.getElementById('send-invite-btn').addEventListener('click', () => {
      if (!selectedUserKey) return;
      const invitedUser = Users.getUser(selectedUserKey);
      Pairs.add(user.username, selectedUserKey);
      Users.update(user.username, { invitedTo: selectedUserKey });
      Users.addNotification(selectedUserKey, {
        type: 'invite',
        from: user.username,
        fromDisplay: user.displayName,
        msg: `💌 ${user.displayName} has invited you to compare quiz answers!`,
        link: 'quiz.html',
      });
      inviteModal.hide();
      selectedUserKey = null;
      showToast(`✅ Invite sent to ${invitedUser.displayName}! 💌`);
      renderComplete(true);
    });

    document.getElementById('inviteModal').addEventListener('hidden.bs.modal', () => {
      document.getElementById('user-search').value = '';
      selectedUserKey = null;
      document.getElementById('send-invite-btn').disabled = true;
    });
  });
</script>
</body>
</html>
