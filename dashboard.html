<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — SNewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">💗 <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1" id="main-nav"></ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">

    <!-- Page heading -->
    <div class="mb-4 fade-in">
      <h1 id="greet-heading" class="section-title">Your Dashboard 💗</h1>
      <p class="section-sub">Track your quiz, notifications, and partner status.</p>
    </div>

    <div class="row g-4" id="dashboard-root">
      <!-- Rendered by JS -->
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">💗 Quiz</div>
      <div class="d-flex gap-4">
        <a href="index.html">Home</a>
        <a href="quiz.html">Quiz</a>
        <a href="results.html">Results</a>
      </div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">© 2026 Quiz · Made with 💕</div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const session = Users.current();
    if (!session) { window.location.href = 'login.html'; return; }

    const user = Users.getUser(session.username);
    const partnerKey = Pairs.getPartner(user.username);
    const partnerUser = partnerKey ? Users.getUser(partnerKey) : null;
    const notifs = (user.notifications || []).slice().reverse();

    document.getElementById('greet-heading').textContent = `Hey, ${user.displayName} 💗`;

    // Mark all notifications as read
    if (notifs.some(n => !n.read)) {
      const users = Users.getAll();
      users[user.username].notifications = users[user.username].notifications.map(n => ({ ...n, read: true }));
      DB.set('sq_users', users);
    }

    const canSeeResults = user.answeredQuiz && partnerUser?.answeredQuiz;

    /* ── Left column: Profile + Partner ── */
    const leftCol = `
      <div class="col-md-5 col-lg-4">

        <!-- Profile card -->
        <div class="profile-card mb-3 fade-in">
          <div class="big-avatar">${user.displayName.charAt(0).toUpperCase()}</div>
          <h5 style="font-family:'Playfair Display',serif;color:var(--sq-dark);margin-bottom:0.2rem;">${user.displayName}</h5>
          <p style="color:var(--sq-muted);font-size:0.85rem;margin-bottom:1rem;">@${user.username}</p>

          <div class="mb-3">
            <span class="${user.answeredQuiz ? 'badge-sq-done' : 'badge-sq-pending'}">
              ${user.answeredQuiz ? '<i class="bi bi-check-circle-fill me-1"></i>Quiz Completed' : '<i class="bi bi-pencil me-1"></i>Quiz Pending'}
            </span>
          </div>

          <div class="d-grid gap-2">
            ${!user.answeredQuiz ? `<a href="quiz.html" class="btn btn-primary"><i class="bi bi-pencil-square me-2"></i>Take the Quiz</a>` : ''}
            ${canSeeResults ? `<a href="results.html" class="btn btn-primary"><i class="bi bi-fire me-2"></i>See Compatibility</a>` : ''}
            ${user.answeredQuiz && !partnerUser ? `<a href="quiz.html" class="btn btn-soft"><i class="bi bi-send me-2"></i>Invite Someone</a>` : ''}
            <button class="btn btn-outline-secondary" id="logout-btn" style="border-radius:50px;">
              <i class="bi bi-box-arrow-right me-2"></i>Sign Out
            </button>
          </div>
        </div>

        <!-- Partner status -->
        ${partnerUser ? `
          <div class="partner-banner fade-in" style="animation-delay:0.15s">
            <div class="user-avatar-sm" style="background:rgba(255,255,255,0.25);">${partnerUser.displayName.charAt(0).toUpperCase()}</div>
            <div>
              <div class="pb-name">${partnerUser.displayName}</div>
              <div class="pb-sub">@${partnerKey}</div>
              <div class="pb-sub mt-1">${partnerUser.answeredQuiz ? '✅ Completed quiz' : '⏳ Quiz pending…'}</div>
            </div>
          </div>` : `
          <div class="p-3 rounded-3 text-center fade-in" style="background:var(--sq-baby);border:1.5px dashed var(--sq-baby2);">
            <div style="font-size:1.8rem;">🕊️</div>
            <p style="color:var(--sq-muted);font-size:0.85rem;margin:0.5rem 0 0;">No partner linked yet.<br>Complete the quiz to invite someone.</p>
          </div>`}

        <!-- Quick actions -->
        <div class="row g-2 mt-3">
          <div class="col-6">
            <a href="quiz.html" class="quick-card">
              <div class="qi">📝</div>
              <div class="ql">${user.answeredQuiz ? 'Redo Quiz' : 'Start Quiz'}</div>
            </a>
          </div>
          <div class="col-6">
            <a href="results.html" class="quick-card ${!canSeeResults ? 'disabled' : ''}"
               style="${!canSeeResults ? 'opacity:0.45;pointer-events:none;' : ''}">
              <div class="qi">💞</div>
              <div class="ql">Results</div>
            </a>
          </div>
        </div>

      </div>
    `;

    /* ── Right column: Notifications ── */
    let notifsHTML = '';
    if (notifs.length === 0) {
      notifsHTML = `
        <div class="text-center py-5" style="color:var(--sq-muted);">
          <i class="bi bi-bell fs-1 d-block mb-3" style="opacity:0.35;"></i>
          <p>No notifications yet. Invite your person to get started!</p>
          ${user.answeredQuiz ? `<a href="quiz.html" class="btn btn-soft btn-sm">💌 Invite Someone</a>` : ''}
        </div>`;
    } else {
      notifsHTML = notifs.map(n => `
        <div class="notif-card ${!n.read ? 'unread' : ''}">
          <div class="notif-icon-wrap">💌</div>
          <div class="flex-grow-1">
            <div style="font-size:0.92rem;color:var(--sq-text);margin-bottom:0.25rem;">${n.msg}</div>
            <div style="font-size:0.75rem;color:var(--sq-muted);">
              <i class="bi bi-clock me-1"></i>${new Date(n.id).toLocaleString()}
            </div>
            ${n.link ? `<a href="${n.link}" class="btn btn-soft btn-sm mt-2" style="font-size:0.78rem;padding:0.25rem 0.7rem;">
              Go to Quiz <i class="bi bi-arrow-right ms-1"></i></a>` : ''}
          </div>
        </div>`).join('');
    }

    const rightCol = `
      <div class="col-md-7 col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 fade-in" style="border:1.5px solid var(--sq-baby2) !important;">
          <div class="card-header bg-white border-0 pt-3 pb-2 px-4 rounded-top-4">
            <h5 style="font-family:'Playfair Display',serif;color:var(--sq-dark);margin:0;">
              <i class="bi bi-bell-fill me-2" style="color:var(--sq-mid);"></i>Notifications
              ${notifs.length > 0 ? `<span class="badge ms-2" style="background:var(--sq-baby2);color:var(--sq-dark);font-size:0.75rem;">${notifs.length}</span>` : ''}
            </h5>
          </div>
          <div class="card-body px-4 pb-4">
            ${notifsHTML}
          </div>
        </div>
      </div>
    `;

    document.getElementById('dashboard-root').innerHTML = leftCol + rightCol;

    document.getElementById('logout-btn').addEventListener('click', () => {
      Users.logout();
      window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>
