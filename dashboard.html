<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — NewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="./style.css"/>
  <script>
var DB={get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};
function hashPw(pw){var key='sq_key_2025',out='';for(var i=0;i<pw.length;i++){out+=('0'+(pw.charCodeAt(i)^key.charCodeAt(i%key.length)).toString(16)).slice(-2);}return out;}
var Users={all:function(){return DB.get('sq_users')||{};},get:function(u){if(!u)return null;return this.all()[String(u).toLowerCase()]||null;},logout:function(){DB.del('sq_session');},current:function(){try{var k=DB.get('sq_session');return k?this.get(k):null;}catch(e){return null;}}};
var Pairs={all:function(){return DB.get('sq_pairs')||[];},partner:function(u){try{var k=String(u).toLowerCase(),pair=this.all().find(function(p){return p.a===k||p.b===k;});return pair?(pair.a===k?pair.b:pair.a):null;}catch(e){return null;}}};
function showToast(msg){try{var t=document.createElement('div');t.className='toast-sq';t.innerHTML=msg;document.body.appendChild(t);setTimeout(function(){try{document.body.removeChild(t);}catch(e){}},5000);}catch(e){}}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  </script>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="./index.html">&#128151; <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1" id="main-nav"></ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">
    <div class="mb-4 fade-in">
      <h1 id="greet" class="section-title">Dashboard &#128151;</h1>
      <p class="section-sub">Track your quiz, notifications and partner status.</p>
    </div>
    <div class="row g-4" id="dash-root"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">&#128151; NewbiesQuiz</div>
      <div class="d-flex gap-4">
        <a href="./index.html">Home</a>
        <a href="./quiz.html">Quiz</a>
        <a href="./results.html">Results</a>
      </div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">&copy; 2026 NewbiesQuiz</div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var session = Users.current();
  if (!session) { window.location.href = './login.html'; }

  var user = Users.get(session.username);
  var partnerKey = Pairs.partner(user.username);
  var partnerUser = partnerKey ? Users.get(partnerKey) : null;
  var notifs = (user.notifications || []).slice().reverse();
  var canSeeResults = user.answeredQuiz && partnerUser && partnerUser.answeredQuiz;

  document.getElementById('greet').textContent = 'Hey, ' + user.displayName + ' \uD83D\uDC97';

  // Mark all notifications as read
  (function(){
    if (notifs.some(function(n){ return !n.read; })) {
      var all = Users.all();
      var k = user.username;
      if (all[k]) {
        all[k].notifications = (all[k].notifications || []).map(function(n){ return Object.assign({}, n, {read: true}); });
        DB.set('sq_users', all);
      }
    }
  })();

  // Render nav
  (function(){
    try {
      var nc = notifs.filter(function(n){ return !n.read; }).length;
      var init = user.displayName.charAt(0).toUpperCase();
      document.getElementById('main-nav').innerHTML =
        '<li class="nav-item"><a class="nav-link" href="./quiz.html">Quiz</a></li>'+
        '<li class="nav-item"><a class="nav-link" href="./results.html">Results</a></li>'+
        '<li class="nav-item"><a class="nav-link position-relative" href="./dashboard.html">&#128276;'+(nc>0?'<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.62rem;">'+nc+'</span>':'')+'</a></li>'+
        '<li class="nav-item"><a class="btn-nav-cta btn ms-2" href="./dashboard.html"><span style="background:rgba(255,255,255,0.25);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;margin-right:6px;">'+init+'</span>'+escHtml(user.displayName)+'</a></li>';
    } catch(e) {}
  })();

  // Build left column
  var leftHTML =
    '<div class="col-md-5 col-lg-4">'+
      '<div class="profile-card mb-3 fade-in">'+
        '<div class="big-avatar">'+user.displayName.charAt(0).toUpperCase()+'</div>'+
        '<h5 style="font-family:\'Playfair Display\',serif;color:var(--sq-dark);margin-bottom:0.2rem;">'+escHtml(user.displayName)+'</h5>'+
        '<p style="color:var(--sq-muted);font-size:0.85rem;margin-bottom:1rem;">@'+escHtml(user.username)+'</p>'+
        '<div class="mb-3">'+
          '<span class="'+(user.answeredQuiz?'badge-sq-done':'badge-sq-pending')+'">'+
            (user.answeredQuiz?'&#9989; Quiz Completed':'&#128221; Quiz Pending')+
          '</span>'+
        '</div>'+
        '<div class="d-grid gap-2">'+
          (!user.answeredQuiz?'<a href="./quiz.html" class="btn btn-primary"><i class="bi bi-pencil-square me-2"></i>Take the Quiz</a>':'')+
          (canSeeResults?'<a href="./results.html" class="btn btn-primary"><i class="bi bi-fire me-2"></i>See Compatibility</a>':'')+
          (user.answeredQuiz && !partnerUser?'<a href="./quiz.html" class="btn btn-soft"><i class="bi bi-send me-2"></i>Invite Someone</a>':'')+
          '<button type="button" class="btn btn-outline-secondary" id="logout-btn" style="border-radius:50px;"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</button>'+
        '</div>'+
      '</div>'+
      (partnerUser?
        '<div class="partner-banner fade-in" style="animation-delay:0.15s">'+
          '<div class="user-avatar-sm" style="background:rgba(255,255,255,0.25);">'+partnerUser.displayName.charAt(0).toUpperCase()+'</div>'+
          '<div>'+
            '<div class="pb-name">'+escHtml(partnerUser.displayName)+'</div>'+
            '<div class="pb-sub">@'+escHtml(partnerKey)+'</div>'+
            '<div class="pb-sub mt-1">'+(partnerUser.answeredQuiz?'&#9989; Completed':'&#9203; Quiz pending…')+'</div>'+
          '</div>'+
        '</div>':
        '<div class="p-3 rounded-3 text-center fade-in" style="background:var(--sq-baby);border:1.5px dashed var(--sq-baby2);">'+
          '<div style="font-size:1.8rem;">&#128202;</div>'+
          '<p style="color:var(--sq-muted);font-size:0.85rem;margin:0.5rem 0 0;">No partner linked yet.<br>Complete the quiz to invite someone.</p>'+
        '</div>')+
      '<div class="row g-2 mt-3">'+
        '<div class="col-6"><a href="./quiz.html" class="quick-card"><div class="qi">&#128221;</div><div class="ql">'+(user.answeredQuiz?'Redo Quiz':'Start Quiz')+'</div></a></div>'+
        '<div class="col-6"><a href="./results.html" class="quick-card'+(canSeeResults?'':' disabled')+'" '+(canSeeResults?'':'style="opacity:0.45;pointer-events:none;"')+'><div class="qi">&#128158;</div><div class="ql">Results</div></a></div>'+
      '</div>'+
    '</div>';

  // Build right column: notifications
  var notifsHTML = '';
  if (!notifs.length) {
    notifsHTML =
      '<div class="text-center py-5" style="color:var(--sq-muted);">'+
        '<i class="bi bi-bell fs-1 d-block mb-3" style="opacity:0.3;"></i>'+
        '<p>No notifications yet.</p>'+
        (user.answeredQuiz?'<a href="./quiz.html" class="btn btn-soft btn-sm">&#128140; Invite Someone</a>':'')+
      '</div>';
  } else {
    notifs.forEach(function(n){
      notifsHTML +=
        '<div class="notif-card'+(n.read?'':' unread')+'">'+
          '<div class="notif-icon-wrap">&#128140;</div>'+
          '<div class="flex-grow-1">'+
            '<div style="font-size:0.92rem;margin-bottom:0.25rem;">'+n.msg+'</div>'+
            '<div style="font-size:0.75rem;color:var(--sq-muted);"><i class="bi bi-clock me-1"></i>'+new Date(n.id).toLocaleString()+'</div>'+
            (n.link?'<a href="'+n.link+'" class="btn btn-soft btn-sm mt-2" style="font-size:0.78rem;padding:0.25rem 0.7rem;">Go to Quiz <i class="bi bi-arrow-right ms-1"></i></a>':'')+
          '</div>'+
        '</div>';
    });
  }

  var rightHTML =
    '<div class="col-md-7 col-lg-8">'+
      '<div class="card border-0 shadow-sm rounded-4 fade-in" style="border:1.5px solid var(--sq-baby2)!important;">'+
        '<div class="card-header bg-white border-0 pt-3 pb-2 px-4 rounded-top-4">'+
          '<h5 style="font-family:\'Playfair Display\',serif;color:var(--sq-dark);margin:0;">'+
            '<i class="bi bi-bell-fill me-2" style="color:var(--sq-mid);"></i>Notifications'+
            (notifs.length?'<span class="badge ms-2" style="background:var(--sq-baby2);color:var(--sq-dark);font-size:0.75rem;">'+notifs.length+'</span>':'')+
          '</h5>'+
        '</div>'+
        '<div class="card-body px-4 pb-4">'+notifsHTML+'</div>'+
      '</div>'+
    '</div>';

  document.getElementById('dash-root').innerHTML = leftHTML + rightHTML;

  document.getElementById('logout-btn').onclick = function(){
    Users.logout();
    window.location.href = './index.html';
  };
</script>
</body>
</html>
