<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Results — NewbiesQuiz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar navbar-sq navbar-expand-md sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">💗 <span>Quiz</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:#fff;">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-md-1" id="main-nav"></ul>
    </div>
  </div>
</nav>
<div class="ribbon-strip"></div>

<main class="page-main">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-8">

        <div class="text-center mb-4 fade-in">
          <h1 class="section-title">Compatibility Results 💞</h1>
          <p class="section-sub">Here's how you two match up across every topic.</p>
        </div>

        <div id="results-root" class="fade-in"></div>

      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div class="footer-brand">💗 NewbiesQuiz</div>
      <div class="d-flex gap-4">
        <a href="index.html">Home</a>
        <a href="quiz.html">Quiz</a>
        <a href="dashboard.html">Dashboard</a>
      </div>
      <div style="font-size:0.8rem;color:rgba(255,255,255,0.5);">© 2026 Quiz · Made with 💕</div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const session = Users.current();
    if (!session) { window.location.href = 'login.html'; return; }

    const user = Users.getUser(session.username);
    const partnerKey = Pairs.getPartner(user.username);
    const partnerUser = partnerKey ? Users.getUser(partnerKey) : null;
    const root = document.getElementById('results-root');

    /* ── Not-ready states ── */
    function notReady(icon, title, body, btnHref, btnLabel) {
      root.innerHTML = `
        <div class="flash-card text-center py-5">
          <div style="font-size:3rem;margin-bottom:1rem;">${icon}</div>
          <h3 style="color:var(--sq-dark);font-family:'Playfair Display',serif;">${title}</h3>
          <p style="color:var(--sq-muted);max-width:400px;margin:0.8rem auto 2rem;line-height:1.7;">${body}</p>
          <a href="${btnHref}" class="btn btn-primary btn-lg">${btnLabel}</a>
        </div>`;
    }

    if (!user.answeredQuiz) return notReady('📝','Haven\'t taken the quiz yet','Answer all 15 questions first, then invite your person to compare answers.','quiz.html','Take the Quiz 💕');
    if (!partnerUser) return notReady('💌','No partner linked yet','You\'ve completed the quiz — now invite someone to compare your answers with!','quiz.html','Invite Your Person');
    if (!partnerUser.answeredQuiz) return notReady('⏳',`Waiting for ${partnerUser.displayName}…`,`<strong>${partnerUser.displayName}</strong> hasn't completed their quiz yet. Results appear once both of you are done.`,'dashboard.html','Back to Dashboard');

    /* ── Compute ── */
    const { overall, topicPct } = computeCompatibility(user.username, partnerKey);
    const info = getResultMessage(overall);
    const answersA = Answers.get(user.username);
    const answersB = Answers.get(partnerKey);
    const circumference = 2 * Math.PI * 80; // r=80

    /* ── Pair header ── */
    const pairRow = `
      <div class="d-flex align-items-center justify-content-center gap-4 mb-4 flex-wrap">
        <div class="text-center">
          <div class="big-avatar mx-auto mb-2">${user.displayName.charAt(0).toUpperCase()}</div>
          <div style="font-family:'Playfair Display',serif;color:var(--sq-dark);font-size:1rem;">${user.displayName}</div>
          <div style="font-size:0.78rem;color:var(--sq-muted);">@${user.username}</div>
        </div>
        <div class="heartbeat" style="font-size:2.8rem;">💗</div>
        <div class="text-center">
          <div class="big-avatar mx-auto mb-2" style="background:linear-gradient(135deg,#7a0050,var(--sq-mid));">${partnerUser.displayName.charAt(0).toUpperCase()}</div>
          <div style="font-family:'Playfair Display',serif;color:var(--sq-dark);font-size:1rem;">${partnerUser.displayName}</div>
          <div style="font-size:0.78rem;color:var(--sq-muted);">@${partnerKey}</div>
        </div>
      </div>`;

    /* ── Score ring ── */
    const ringHTML = `
      <div class="result-hero-card mb-4">
        ${pairRow}
        <div class="score-ring">
          <svg viewBox="0 0 180 180">
            <defs>
              <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:var(--sq-dark)"/>
                <stop offset="100%" style="stop-color:var(--sq-accent)"/>
              </linearGradient>
            </defs>
            <circle class="score-ring-bg" cx="90" cy="90" r="80"/>
            <circle class="score-ring-fill" cx="90" cy="90" r="80" id="ring-fill"
              style="stroke-dasharray:${circumference};stroke-dashoffset:${circumference}"/>
          </svg>
          <div class="score-center">
            <div class="score-number" id="score-num">0</div>
            <div style="font-size:0.9rem;color:var(--sq-muted);">%</div>
          </div>
        </div>

        <div class="tier-badge">${info.emoji} ${info.tier}</div>
        <div class="result-msg-box">${info.msg}</div>

        <div class="d-flex gap-3 justify-content-center flex-wrap mt-3">
          <a href="dashboard.html" class="btn btn-soft"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
          <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-2"></i>Save Results</button>
        </div>
      </div>`;

    /* ── Topic breakdown ── */
    const breakdownHTML = `
      <div class="card border-0 rounded-4 mb-4" style="border:1.5px solid var(--sq-baby2)!important;box-shadow:0 4px 20px var(--sq-shadow);">
        <div class="card-header bg-white border-0 pt-3 pb-2 px-4 rounded-top-4">
          <h5 style="font-family:'Playfair Display',serif;color:var(--sq-dark);margin:0;">
            <i class="bi bi-bar-chart-fill me-2" style="color:var(--sq-mid);"></i>Topic Breakdown
          </h5>
        </div>
        <div class="card-body px-4 pb-4">
          ${Object.entries(topicPct).map(([topic, pct]) => `
            <div class="topic-bar-row">
              <div class="d-flex justify-content-between align-items-center">
                <div class="topic-bar-label">${TOPIC_META[topic]?.icon || ''} ${TOPIC_META[topic]?.label || topic}</div>
                <div style="font-size:0.85rem;font-weight:700;color:var(--sq-dark);">${pct}%</div>
              </div>
              <div class="topic-bar-track">
                <div class="topic-bar-fill" data-pct="${pct}" style="width:0%"></div>
              </div>
            </div>`).join('')}
        </div>
      </div>`;

    /* ── Answer comparison ── */
    const comparisonHTML = `
      <div class="card border-0 rounded-4 mb-4" style="border:1.5px solid var(--sq-baby2)!important;box-shadow:0 4px 20px var(--sq-shadow);">
        <div class="card-header bg-white border-0 pt-3 pb-2 px-4 rounded-top-4">
          <h5 style="font-family:'Playfair Display',serif;color:var(--sq-dark);margin:0;">
            <i class="bi bi-chat-heart-fill me-2" style="color:var(--sq-mid);"></i>How Your Answers Compare
          </h5>
          <p class="text-muted mb-0" style="font-size:0.82rem;">Scroll through each question to see where you align</p>
        </div>
        <div class="card-body px-4 pb-4">
          ${QUESTIONS.map(q => {
            const aAns = answersA[q.id] || '(no answer)';
            const bAns = answersB[q.id] || '(no answer)';
            const sim = scoreAnswerPair(q, aAns, bAns);
            const matchLabel = sim >= 0.8 ? { icon:'bi-check-circle-fill', text:'Great match!', color:'#1a7a4a' }
              : sim >= 0.4 ? { icon:'bi-arrow-repeat', text:'Some overlap', color:'var(--sq-mid)' }
              : sim > 0  ? { icon:'bi-lightbulb', text:'Different views', color:'#c07020' }
              : { icon:'bi-dash-circle', text:'No answer', color:'#999' };
            return `
              <div class="compare-card">
                <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-2">
                  <span class="topic-badge" style="font-size:0.7rem;">${q.icon} ${TOPIC_META[q.topic]?.label}</span>
                  <span class="match-chip" style="color:${matchLabel.color};">
                    <i class="bi ${matchLabel.icon} me-1"></i>${matchLabel.text}
                  </span>
                </div>
                <p style="font-size:0.88rem;color:var(--sq-muted);font-style:italic;margin-bottom:0.8rem;">${q.text}</p>
                <div class="row g-2">
                  <div class="col-6">
                    <div class="compare-ans">
                      <div class="compare-who">${user.displayName}</div>
                      ${aAns}
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="compare-ans">
                      <div class="compare-who">${partnerUser.displayName}</div>
                      ${bAns}
                    </div>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;

    root.innerHTML = ringHTML + breakdownHTML + comparisonHTML;

    /* ── Animations ── */
    // Ring fill
    setTimeout(() => {
      const fill = document.getElementById('ring-fill');
      if (fill) fill.style.strokeDashoffset = circumference - (overall / 100) * circumference;
      // Count-up
      const numEl = document.getElementById('score-num');
      let v = 0;
      const iv = setInterval(() => {
        v += 2;
        if (v >= overall) { v = overall; clearInterval(iv); }
        if (numEl) numEl.textContent = v;
      }, 18);
    }, 200);

    // Topic bars
    setTimeout(() => {
      document.querySelectorAll('.topic-bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    }, 400);
  });
</script>
</body>
</html>
